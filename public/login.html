<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setter con IA — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
body {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; position: relative;
}
body::before {
  content: ''; position: fixed; width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(29,74,114,0.3) 0%, transparent 70%);
  top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none;
}
.login-wrap {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center; gap: 36px;
  animation: fadeUp 0.7s ease forwards;
}
.login-logo { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.login-logo img { width: 27px; height: 37px; filter: drop-shadow(0 0 8px rgba(55,140,216,0.5)); }
.login-logo-name { font-size: 13px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
.login-card {
  width: 420px; max-width: calc(100vw - 32px);
  background: var(--card-bg); border-radius: 20px;
  padding: 44px 44px 40px; display: flex; flex-direction: column; gap: 24px;
  position: relative; overflow: hidden;
}
.login-card::before {
  content: ''; position: absolute; inset: 0; border-radius: 20px; padding: 1px;
  background: var(--grad);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude; -webkit-mask-composite: destination-out; pointer-events: none;
}
.login-heading { text-align: center; }
.login-heading h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
.login-heading p { font-size: 13px; color: var(--text-fade); }
.login-divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(55,140,216,0.3), transparent); }
.login-error {
  font-size: 12px; color: var(--red); text-align: center;
  min-height: 16px; opacity: 0; transition: opacity 0.3s;
}
.login-error.show { opacity: 1; }
.login-btn {
  width: 100%; padding: 15px; background: var(--grad-btn); border: none; border-radius: 12px;
  color: #fff; font-family: var(--font); font-size: 14px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
  transition: all 0.3s; box-shadow: 0 0 20px rgba(29,74,114,0.4);
}
.login-btn:hover { box-shadow: 0 0 28px rgba(55,140,216,0.5); transform: translateY(-1px); }
.login-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(161,210,225,0.5); }
.pw-wrap { position: relative; }
.pw-eye {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.3);
  display: flex; align-items: center; transition: color 0.2s; padding: 2px;
}
.pw-eye:hover { color: var(--blue-mid); }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
.shake { animation: shake 0.4s ease; }
@media (max-width: 480px) {
  .login-card { padding: 32px 24px; }
}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-logo">
    <img src="https://assets.cdn.filesafe.space/viKKPXD4WZGBeMjzT0tt/media/69b2ba63eba487f12ae6fc60.svg" alt="Logo">
    <div class="login-logo-name">Setter con IA</div>
  </div>
  <div class="login-card">
    <div class="login-heading">
      <h1>Acceso a la Plataforma</h1>
      <p>Ingresá tus credenciales para continuar</p>
    </div>
    <div class="login-divider"></div>
    <form id="loginForm" autocomplete="on">
      <div style="display:flex;flex-direction:column;gap:16px;">
        <div class="field">
          <label class="field-label">Email</label>
          <input type="email" class="input" id="email" placeholder="tu@email.com" required autocomplete="email">
        </div>
        <div class="field">
          <label class="field-label">Contraseña</label>
          <div class="pw-wrap">
            <input type="password" class="input" id="password" placeholder="••••••••••" required autocomplete="current-password" style="padding-right:46px;">
            <button type="button" class="pw-eye" id="pwEye" tabindex="-1">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="login-error" id="loginError">Credenciales incorrectas</div>
        <button type="submit" class="login-btn" id="loginBtn">Ingresar</button>
      </div>
    </form>
  </div>
</div>

<script>
const form = document.getElementById('loginForm');
const errorEl = document.getElementById('loginError');
const pwInput = document.getElementById('password');
const pwEye = document.getElementById('pwEye');

pwEye.addEventListener('click', () => {
  const isPass = pwInput.type === 'password';
  pwInput.type = isPass ? 'text' : 'password';
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.classList.remove('show');
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Ingresando...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: pwInput.value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    window.location.href = '/dashboard.html';
  } catch (err) {
    errorEl.textContent = err.message || 'Credenciales incorrectas';
    errorEl.classList.add('show');
    pwInput.classList.add('shake');
    setTimeout(() => pwInput.classList.remove('shake'), 400);
    btn.disabled = false; btn.textContent = 'Ingresar';
  }
});

// Auto-redirect if already logged in
fetch('/api/auth/me').then(r => r.json()).then(u => {
  if (u.role) window.location.href = u.role === 'admin' ? '/admin.html' : '/dashboard.html';
}).catch(() => {});
</script>
</body>
</html>
