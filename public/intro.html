<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setter con IA — Mirá esto antes de entrar</title>
<meta name="description" content="Antes de acceder al curso, mirá este video.">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #07111f;
  --text: #ffffff;
  --text2: #a8c8e8;
  --text3: #7a93aa;
  --accent: #4ab8fe;
  --orange: #ff9d3a;
  --green: #25d366;
  --font: 'Poppins', system-ui, sans-serif;
}
html, body { min-height:100vh; background:var(--bg); color:var(--text2); font-family:var(--font); -webkit-font-smoothing:antialiased; }
body {
  background-image:
    radial-gradient(ellipse 70% 50% at 50% -10%, rgba(20,80,160,0.35), transparent 60%),
    radial-gradient(ellipse 50% 40% at 90% 80%, rgba(74,184,254,0.08), transparent 50%),
    radial-gradient(ellipse 40% 30% at 10% 90%, rgba(74,184,254,0.05), transparent 50%);
  background-attachment:fixed;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:40px 20px; min-height:100vh;
}
h1, h2 { color:var(--text); }

.brand {
  display:flex; align-items:center; gap:10px; margin-bottom:32px;
}
.brand-badge {
  width:36px; height:36px; border-radius:9px;
  background:linear-gradient(135deg,#4ab8fe,#2196f3);
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:800; color:#fff;
}
.brand-name { font-size:16px; font-weight:600; color:var(--text); letter-spacing:-0.3px; }

.intro-card {
  width:100%; max-width:920px;
  background:linear-gradient(140deg,#0c1d30,#091624);
  border:1px solid rgba(74,184,254,0.15);
  border-radius:24px; overflow:hidden;
  box-shadow:0 32px 80px rgba(0,0,0,0.5);
}

.video-wrap {
  width:100%; aspect-ratio:16/9; background:#000;
  position:relative; display:flex; align-items:center; justify-content:center;
}
.video-wrap iframe { width:100%; height:100%; border:0; display:block; }
.video-placeholder {
  text-align:center; color:var(--text3); padding:30px;
}
.video-placeholder .ico {
  font-size:42px; margin-bottom:14px; opacity:0.4;
}
.video-placeholder p { font-size:14px; line-height:1.6; max-width:420px; margin:0 auto; }

.intro-body {
  padding:40px 40px 44px; text-align:center;
}
.headline {
  font-size:clamp(22px, 3vw, 30px); font-weight:800; line-height:1.2;
  margin-bottom:14px;
  background:linear-gradient(180deg, #fff 50%, #4ab8fe);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.subline {
  font-size:14px; color:var(--text3); line-height:1.55;
  max-width:560px; margin:0 auto 28px;
}

.countdown {
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom:18px; font-size:13px; color:var(--text3);
  letter-spacing:0.3px;
  transition:opacity 0.4s;
}
.countdown.done { opacity:0; height:0; margin:0; pointer-events:none; }
.countdown-icon {
  width:14px; height:14px; border:2px solid rgba(255,157,58,0.5);
  border-top-color:var(--orange); border-radius:50%;
  animation:spin 1.4s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.countdown-time {
  font-family:'Poppins',monospace; font-weight:700; color:var(--orange);
  font-variant-numeric:tabular-nums;
}

.btn-enter {
  display:inline-flex; align-items:center; gap:10px;
  padding:18px 44px; border-radius:14px;
  font-size:15px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  color:#fff; border:none; cursor:not-allowed;
  background:linear-gradient(135deg, #2a3a4d, #1f2a38);
  box-shadow:0 4px 14px rgba(0,0,0,0.3);
  transition:all 0.3s;
  font-family:var(--font);
  opacity:0.7;
}
.btn-enter.unlocked {
  cursor:pointer; opacity:1;
  background:linear-gradient(135deg, var(--green), #1faa54);
  box-shadow:0 8px 28px rgba(37,211,102,0.4);
  animation:pulse 1.6s ease-in-out infinite;
}
.btn-enter.unlocked:hover { transform:translateY(-2px); box-shadow:0 12px 36px rgba(37,211,102,0.55); }
.btn-enter.unlocked:active { transform:translateY(0); }
@keyframes pulse {
  0%, 100% { box-shadow:0 8px 28px rgba(37,211,102,0.4); }
  50% { box-shadow:0 8px 28px rgba(37,211,102,0.7), 0 0 0 6px rgba(37,211,102,0.1); }
}

.foot-note {
  margin-top:24px; font-size:11px; color:var(--text3);
  letter-spacing:0.3px;
}
.foot-note a { color:var(--text2); text-decoration:none; border-bottom:1px dashed rgba(168,200,232,0.3); }
.foot-note a:hover { color:var(--accent); border-color:var(--accent); }

@media (max-width:600px) {
  .intro-body { padding:28px 24px 32px; }
  .btn-enter { padding:16px 32px; font-size:13px; }
}
</style>
</head>
<body>

<div class="brand">
  <div class="brand-badge">SI</div>
  <div class="brand-name">Setter con IA</div>
</div>

<div class="intro-card">
  <div class="video-wrap" id="videoWrap">
    <iframe
      src="https://www.youtube.com/embed/_3kY-ZxNjJo?rel=0&modestbranding=1&controls=1"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
      allowfullscreen></iframe>
  </div>

  <div class="intro-body">
    <h1 class="headline">Mirá esto antes de entrar</h1>
    <p class="subline">El botón para acceder a la plataforma se desbloquea cuando termine el video.</p>

    <div class="countdown" id="countdown">
      <div class="countdown-icon"></div>
      <span>El acceso se desbloquea en <span class="countdown-time" id="cdTime">3:09</span></span>
    </div>

    <button class="btn-enter" id="btnEnter" disabled onclick="enter()">
      <span id="btnLabel">🔒 ACCESO BLOQUEADO</span>
    </button>

  </div>
</div>

<script>
// ── Countdown 3:09 (duración del video) — botón realmente bloqueado ──
const TOTAL = 3 * 60 + 9; // 189s
let remaining = TOTAL;
const cdEl = document.getElementById('countdown');
const cdTimeEl = document.getElementById('cdTime');
const btnEnter = document.getElementById('btnEnter');
const btnLabel = document.getElementById('btnLabel');

function fmt(s) {
  const m = Math.floor(s/60), sec = s % 60;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}
cdTimeEl.textContent = fmt(remaining);

const tick = setInterval(() => {
  remaining--;
  if (remaining <= 0) {
    clearInterval(tick);
    cdEl.classList.add('done');
    btnEnter.classList.add('unlocked');
    btnEnter.disabled = false;
    btnLabel.textContent = '✓ ACCEDER A LA PLATAFORMA';
    return;
  }
  cdTimeEl.textContent = fmt(remaining);
}, 1000);

function enter() {
  if (btnEnter.disabled) return;
  window.location.href = '/dashboard.html';
}
</script>

</body>
</html>
